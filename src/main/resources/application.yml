spring:
  application:
    name: promise-graph
  main:
    banner-mode: off
  # The datasource is only used when promisegraph.store=jdbc.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/promise_graph}
    username: ${DATABASE_USER:promise}
    password: ${DATABASE_PASSWORD:promise}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

promisegraph:
  tenant: ${PG_TENANT:demo}
  store: ${PG_STORE:memory}            # memory | jdbc
  extractor: ${PG_EXTRACTOR:rules}     # rules | llm
  model: ${PG_MODEL:claude-sonnet-5-5}
  confidence-threshold: ${PG_CONFIDENCE_THRESHOLD:0.8}
  llm-max-concurrency: ${PG_LLM_MAX_CONCURRENCY:4}
  webhook-token: ${PG_WEBHOOK_TOKEN:}
  temporal:
    address: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    worker-enabled: ${PG_WORKER_ENABLED:true}
  gateway:
    max-batch: 20
    max-wait: 30s
  handoff:
    planner: ${PG_HANDOFF_PLANNER:rules}   # rules | agent
    prep-days: ${PG_HANDOFF_PREP_DAYS:3}
    agent-max-steps: ${PG_HANDOFF_AGENT_MAX_STEPS:12}
  negotiation:
    enabled: ${PG_NEGOTIATION_ENABLED:true}
    planner: ${PG_NEGOTIATION_PLANNER:rules}   # rules | agent
    min-teams: ${PG_NEGOTIATION_MIN_TEAMS:2}
    capacity: ${PG_NEGOTIATION_CAPACITY:8}
    approval-hours: ${PG_NEGOTIATION_APPROVAL_HOURS:72}
    reminder-hours: ${PG_NEGOTIATION_REMINDER_HOURS:24}
    max-rounds: ${PG_NEGOTIATION_MAX_ROUNDS:3}
    agent-max-steps: ${PG_NEGOTIATION_AGENT_MAX_STEPS:12}
    customers: ${PG_CUSTOMERS:Acme,Globex,Initech}
    team-checks: ${PG_NEGOTIATION_TEAM_CHECKS:true}
  privacy:
    admins: ${PG_ADMINS:}   # comma-separated ids allowed on the operations page besides team leads
  gmail:
    enabled: ${PG_GMAIL_ENABLED:false}
    credentials-file: ${PG_GMAIL_CREDENTIALS:${user.home}/.promise-graph/gmail-credentials.json}
    token-file: ${PG_GMAIL_TOKEN:${user.home}/.promise-graph/gmail-token.json}
    poll-interval: ${PG_GMAIL_POLL_INTERVAL:60s}
    backfill-days: ${PG_GMAIL_BACKFILL_DAYS:2}

server:
  port: ${PORT:8787}
  # The web app has no login yet, so it only listens on this computer.
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    dev.promisegraph: INFO

management:
  server:
    # Metrics and health on their own port. On Linux, set PG_MANAGEMENT_ADDRESS=0.0.0.0 so the
    # Prometheus container can reach it; the main app stays on localhost.
    port: ${PG_MANAGEMENT_PORT:8788}
    address: ${PG_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: promise-graph
