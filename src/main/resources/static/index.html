<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promise Graph</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #2f5bd3; --accent-ink: #ffffff; --good: #2e7d4f; --warn: #b26a00; --bad: #b3261e; --soft: #eef1fb;
  }
  :root { color-scheme: light; }
  /* Dark: follows the system unless the toggle chose a theme (data-theme on <html>). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
            --accent: #7d9cf0; --accent-ink: #10131c; --good: #6cc496; --warn: #e2a53f; --bad: #f08a80; --soft: #232838; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
          --accent: #7d9cf0; --accent-ink: #10131c; --good: #6cc496; --warn: #e2a53f; --bad: #f08a80; --soft: #232838; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
  nav button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
  .who { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card.done { opacity: .6; }
  .meta { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  [hidden] { display: none !important; }
  button.act, a.act, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; }
  a.act { text-decoration: none; display: inline-block; }
  button.primary, a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
  .s-assigned, .s-completed, .s-active, .s-confirmed, .s-accepted, .s-transferred, .s-covered, .s-returned, .s-applied, .s-auto_fixed, .s-retried { color: var(--good); }
  .s-at_risk, .s-suggested, .s-proposed, .s-awaiting_cover, .s-needs_owner, .s-planning, .s-scheduled, .s-awaiting_approval, .s-applying { color: var(--warn); }
  .s-broken, .s-rejected, .s-uncovered, .s-cancelled, .s-failed, .s-unresolved { color: var(--bad); }
  .s-detected, .s-kept, .s-dismissed, .s-closed, .s-active-handoff, .s-nothing_to_hand_over, .s-expired, .s-superseded, .s-dismissed { color: var(--muted); }
  .banner { box-sizing: border-box; width: calc(100% - 32px); max-width: 968px; margin: 16px auto 0; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 8px; color: var(--warn); }
  .banner a { color: inherit; font-weight: 600; }
  .note { margin-top: 4px; font-size: 13px; color: var(--warn); }
  h2.section { margin-top: 36px; }
  .sortbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
  .sortbar label { display: flex; gap: 6px; align-items: center; }
  /* Sign-in screen: a split card, art and caption on the left, Google sign-in on the right. */
  body.auth header { display: none; }
  body.auth main { max-width: none; margin: 0; padding: 0; min-height: 100vh; }
  .auth-card { min-height: 100vh; display: grid; grid-template-columns: 1fr;
               background: radial-gradient(70% 55% at 85% 0%, rgba(124, 99, 230, .14), transparent 70%),
                           radial-gradient(60% 50% at 100% 100%, rgba(124, 99, 230, .10), transparent 70%), var(--bg); }
  @media (min-width: 820px) { .auth-card { grid-template-columns: 1.1fr 1fr; } }
  .auth-art { position: relative; overflow: hidden; min-height: 320px; color: #f3f1ff;
              background: radial-gradient(120% 70% at 70% 105%, #b9a4ff 0%, rgba(150, 120, 255, 0) 55%),
                          linear-gradient(170deg, #3a2f7a 0%, #5a46b8 45%, #6d55d6 70%, #2a2350 100%); }
  .auth-art svg.constellation { position: absolute; inset: 0; width: 100%; height: 100%; }
  .auth-art svg.constellation line { stroke: rgba(255, 255, 255, .28); stroke-width: 1; }
  .auth-art svg.constellation circle { fill: #fff; }
  .auth-art .brand { position: absolute; top: 20px; left: 22px; display: flex; gap: 8px; align-items: center; font-weight: 600; letter-spacing: .01em; }
  .auth-art .brand svg { width: 22px; height: 22px; }
  .auth-art .caption { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; padding: 0 28px; }
  .auth-art .caption p { margin: 0 auto; max-width: 420px; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.3; font-weight: 500; min-height: 2.6em; text-wrap: balance;
                         transition: opacity .4s ease; }
  .auth-art .caption p.fade { opacity: 0; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 18px; }
  .dots button { width: 22px; height: 3px; padding: 0; border: 0; border-radius: 2px; background: rgba(255, 255, 255, .35); cursor: pointer; }
  .dots button.on { width: 30px; background: #fff; }
  .auth-form { display: flex; flex-direction: column; justify-content: center; padding: 40px 24px 56px; width: 100%; max-width: 420px; margin: 0 auto; }
  @media (min-width: 820px) { .auth-form { padding: 48px 40px; } .auth-art .caption { bottom: 48px; } .auth-art .brand { top: 28px; left: 32px; } }
  .auth-form h1 { font-size: 32px; line-height: 1.15; margin: 0 0 8px; font-weight: 600; letter-spacing: -.01em; }
  .auth-form .sub { color: var(--muted); margin: 0 0 32px; }
  a.google { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--line);
             border-radius: 10px; background: var(--bg); color: var(--ink); text-decoration: none; font-weight: 500; transition: background .15s, border-color .15s; }
  a.google:hover { background: var(--soft); border-color: var(--accent); }
  a.google:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.google svg { width: 18px; height: 18px; flex: none; }
  .auth-form .fine { color: var(--muted); font-size: 13px; margin: 20px 0 0; }
  @media (prefers-reduced-motion: reduce) { .auth-art .caption p { transition: none; } }
  .s-awaiting_approval { color: var(--warn); }
  .s-handed_over { color: var(--good); }
  .plan { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .plan.chosen { border-color: var(--good); }
  .plan h3 { font-size: 15px; margin: 0; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .votes { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .err { color: var(--bad); font-size: 13px; }
  .split { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 820px) { .split { grid-template-columns: 1fr 1fr; } }
  svg text { fill: var(--ink); font-size: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
              background: var(--panel); color: var(--muted); cursor: pointer; flex: none; }
  #themeToggle { margin-left: auto; }
  .who:not([hidden]) ~ #themeToggle { margin-left: 0; }
  .icon-btn:hover { color: var(--ink); background: var(--soft); }
  .icon-btn svg { width: 16px; height: 16px; }
  textarea { font: inherit; font-size: 14px; line-height: 1.55; width: 100%; min-height: 180px; padding: 10px 12px; border: 1px solid var(--line);
             border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .draft-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
  tr.fu-row > td { background: var(--soft); padding: 14px 16px; }
  tr.fu-row textarea { background: var(--panel); margin-top: 8px; }
</style>
<script>
  // Before first paint, so a saved theme never flashes the other one.
  try { const t = localStorage.getItem('pg.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* private window */ }
</script>
</head>
<body>
<header>
  <h1>Promise Graph</h1>
  <nav id="tabs">
    <button data-tab="inbox" class="on">Inbox</button>
    <button data-tab="promises">Promises</button>
    <button data-tab="links">Links</button>
    <button data-tab="graph">Graph</button>
    <button data-tab="handoffs">Handoffs</button>
    <button data-tab="ops">Ops</button>
    <button data-tab="team" id="teamTab" hidden>People</button>
  </nav>
  <label class="who">Viewing as <select id="person"></select></label>
  <span class="who" id="account" hidden></span>
  <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch between light and dark mode"></button>
</header>
<div id="gmailProblem" class="banner" hidden></div>
<main id="view"></main>

<script>
const state = { tab: 'inbox', person: null, people: [], showDone: false, allPromises: false, me: { mode: 'none' } };
const $view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pill = s => `<span class="pill s-${esc(s)}">${esc(String(s).replace(/_/g, ' '))}</span>`;
const when = iso => iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } } };

async function api(path, opts = {}) {
  // Demo mode: the server trusts this header. Team mode: the server ignores it and uses the signed-in user.
  const headers = { 'Content-Type': 'application/json', ...(state.person ? { 'X-PG-Viewer': state.person } : {}) };
  const res = await fetch('/api' + path, { headers, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText || `HTTP ${res.status}`);
  return body;
}
const post = (path, data) => api(path, { method: 'POST', body: JSON.stringify(data) });
const put = (path, data) => api(path, { method: 'PUT', body: JSON.stringify(data) });
const name = id => (state.people.find(p => p.id === id) || {}).name || id;

// ------------------------------------------------------------ inbox
const NEEDS_DATE = new Set(['new date', 'slip', 'set date']);

async function renderInbox() {
  if (!state.person) { $view.innerHTML = '<div class="empty">Choose who you are at the top right.</div>'; return; }
  const items = await api(`/inbox?person=${encodeURIComponent(state.person)}&all=${state.showDone}`);
  const open = items.filter(i => i.status === 'open').length;
  $view.innerHTML = `
    <h2>Inbox for ${esc(name(state.person))}</h2>
    <p class="lead">${open} waiting for you. Reminders, questions about promises and requests to cover arrive here.</p>
    <div class="toolbar"><label><input type="checkbox" id="showDone" ${state.showDone ? 'checked' : ''}> Show done</label></div>
    ${items.length ? items.map(card).join('') : '<div class="empty">Nothing here right now.</div>'}`;
  document.getElementById('showDone').onchange = e => { state.showDone = e.target.checked; render(); };
  $view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b));
}

function card(i) {
  const done = i.status !== 'open';
  const needsDate = i.actions.some(a => NEEDS_DATE.has(a)) || i.actions.includes('edit');
  return `<div class="card ${done ? 'done' : ''}" data-key="${esc(i.key)}">
    <div>${esc(i.text)}</div>
    <div class="meta">${when(i.createdAt)}${done ? ' · done: ' + esc(i.resolvedAction) : ''}</div>
    ${done || !i.actions.length ? '' : `<div class="row">
      ${i.actions.map(a => `<button class="act ${a === i.actions[0] ? 'primary' : ''}" data-act="${esc(a)}">${esc(a)}</button>`).join('')}
      ${needsDate ? '<input type="date" aria-label="New date">' : ''}
      ${i.actions.includes('edit') ? '<input type="text" placeholder="Reword the promise (optional)" aria-label="Promise text">' : ''}
      ${i.actions.includes('reject all') ? '<input type="text" placeholder="Why? (optional, used for the next plans)" aria-label="Reason">' : ''}
      <span class="err" role="alert"></span></div>`}
  </div>`;
}

async function act(button) {
  const cardEl = button.closest('.card');
  const action = button.dataset.act;
  const due = cardEl.querySelector('input[type=date]')?.value || null;
  const what = cardEl.querySelector('input[type=text]')?.value || null;
  const err = cardEl.querySelector('.err');
  if (NEEDS_DATE.has(action) && !due) { err.textContent = 'Pick a date first.'; return; }
  cardEl.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await post(`/inbox/${encodeURIComponent(cardEl.dataset.key)}/actions`, { action, by: state.person, due, what });
    render();
  } catch (e) {
    err.textContent = e.message;
    cardEl.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// ------------------------------------------------------------ promises
const OPEN_PROMISE = new Set(['detected', 'active', 'at_risk']);
// How a promise's status reads on the Promises page: "kept" is what the owner calls done.
const PROMISE_LABEL = { kept: 'completed', broken: 'missed', at_risk: 'at risk' };
const promisePill = s => `<span class="pill s-${s === 'kept' ? 'completed' : esc(s)}">${esc(PROMISE_LABEL[s] || s)}</span>`;
const linksNote = p => [p.dependsOn.length ? 'waits on ' + p.dependsOn.length : '', p.blocks.length ? p.blocks.length + ' wait on it' : '']
  .filter(Boolean).join(', ');

// Sort for the Promises page. "date" shows only promises due on the picked day; "owner" groups by owner.
const PROMISE_SORTS = { due: 'Due soonest', newest: 'Newest', oldest: 'Oldest', date: 'Due on a date', owner: 'Owner' };
const byText = (f, dir = 1) => (a, b) => dir * String(f(a) || '').localeCompare(String(f(b) || ''));
const dueFirst = (a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999'));
function sortPromises(list, closedList) {
  const sort = state.promiseSort || 'due';
  let out = list.slice();
  if (sort === 'date' && state.promiseDate) out = out.filter(p => p.due === state.promiseDate);
  if (sort === 'owner' && state.promiseOwner) out = out.filter(p => p.owner === state.promiseOwner);
  if (sort === 'newest') return out.sort(byText(p => p.createdAt, -1));
  if (sort === 'oldest') return out.sort(byText(p => p.createdAt));
  if (sort === 'owner') return out.sort((a, b) => name(a.owner).localeCompare(name(b.owner)) || dueFirst(a, b));
  if (closedList && sort !== 'date') return out.sort(byText(p => p.updatedAt, -1)); // history: last closed first
  return out.sort(dueFirst);
}
function promiseSortBar(owners) {
  const sort = state.promiseSort || 'due';
  return `<div class="toolbar sortbar"><label>Sort <select id="pSort">
      ${Object.entries(PROMISE_SORTS).map(([k, v]) => `<option value="${k}" ${k === sort ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    ${sort === 'date' ? `<input type="date" id="pDate" aria-label="Due date" value="${esc(state.promiseDate || '')}">
      ${state.promiseDate ? '<button class="act" id="pDateClear">Clear</button>' : '<span class="meta">Pick a day</span>'}` : ''}
    ${sort === 'owner' ? `<select id="pOwner" aria-label="Owner"><option value="">All owners</option>
      ${owners.map(o => `<option value="${esc(o)}" ${o === state.promiseOwner ? 'selected' : ''}>${esc(name(o))}</option>`).join('')}</select>` : ''}</div>`;
}
const SORT_LEAD = { due: 'soonest due first', newest: 'newest first', oldest: 'oldest first', owner: 'by owner' };

async function renderPromises() {
  const ps = await api('/promises?all=true');
  const owners = [...new Set(ps.map(p => p.owner))].sort((a, b) => name(a).localeCompare(name(b)));
  const open = sortPromises(ps.filter(p => OPEN_PROMISE.has(p.status)), false);
  const closed = sortPromises(ps.filter(p => !OPEN_PROMISE.has(p.status) && (p.status === 'kept' || state.allPromises)), true);
  const sort = state.promiseSort || 'due';
  const order = sort === 'date' ? (state.promiseDate ? 'due on ' + state.promiseDate : 'soonest due first') : SORT_LEAD[sort];
  const about = p => `${esc(p.what)}${p.latestQuote ? `<div class="meta">“${esc(p.latestQuote)}”</div>` : ''}
    ${p.handoff ? `<div class="note">${esc(p.handoff)}</div>` : ''}${p.recipient && p.recipient !== p.owner ? `<div class="meta">for ${esc(name(p.recipient))}</div>` : ''}
    ${linksNote(p) ? `<div class="meta">${esc(linksNote(p))}</div>` : ''}`;
  $view.innerHTML = `
    <h2>Promises</h2>
    <p class="lead">${open.length} open, ${esc(order)}. Mark one done when it's finished; it moves to the history below.
      For a promise from an email, a follow-up can be drafted from the whole thread.</p>
    ${promiseSortBar(owners)}
    ${open.length ? `<table><thead><tr><th>Promise</th><th>Owner</th><th>Due</th><th>Status</th><th>Follow-up</th></tr></thead><tbody>
      ${open.map(p => `<tr><td>${about(p)}</td><td>${esc(name(p.owner))}</td><td>${esc(p.due || '—')}</td>
        <td>${p.canComplete ? `<button class="act" data-done="${esc(p.id)}" title="Currently ${esc(PROMISE_LABEL[p.status] || p.status)}">Mark done</button><div class="err"></div>` : promisePill(p.status)}</td>
        <td>${p.canDraft ? `<button class="act ${followUps[p.id] ? 'primary' : ''}" data-draft-for="${esc(p.id)}">${followUps[p.id] ? 'Hide draft' : 'Draft a follow-up'}</button>` : ''}</td></tr>
        ${followUps[p.id] ? `<tr data-fu-row="${esc(p.id)}" class="fu-row"><td colspan="5">${followUpPanel(p.id)}</td></tr>` : ''}`).join('')}
      </tbody></table>` : `<div class="empty">${sort === 'date' && state.promiseDate ? 'No open promises due on ' + esc(state.promiseDate) + '.'
        : sort === 'owner' && state.promiseOwner ? 'No open promises for ' + esc(name(state.promiseOwner)) + '.'
        : 'No open promises. Send a message or connect Gmail.'}</div>`}
    <h2 class="section">Completed promises</h2>
    <div class="toolbar"><label><input type="checkbox" id="allP" ${state.allPromises ? 'checked' : ''}> Also show missed and cancelled</label></div>
    ${closed.length ? `<table><thead><tr><th>Promise</th><th>Owner</th><th>Due</th><th>Status</th><th>Closed on</th></tr></thead><tbody>
      ${closed.map(p => `<tr><td>${about(p)}</td><td>${esc(name(p.owner))}</td><td>${esc(p.due || '—')}</td><td>${promisePill(p.status)}</td>
        <td class="meta">${esc(String(p.updatedAt || '').slice(0, 10) || '—')}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">${(sort === 'date' && state.promiseDate) || (sort === 'owner' && state.promiseOwner)
        ? 'No completed promises match.' : 'Nothing completed yet.'}</div>`}`;
  document.getElementById('allP').onchange = e => { state.allPromises = e.target.checked; render(); };
  document.getElementById('pSort').onchange = e => { state.promiseSort = e.target.value; render(); };
  const pDate = document.getElementById('pDate');
  if (pDate) {
    pDate.onchange = e => { state.promiseDate = e.target.value || null; render(); };
    if (!state.promiseDate) { try { pDate.showPicker(); } catch (_) { pDate.focus(); } }
  }
  const pDateClear = document.getElementById('pDateClear');
  if (pDateClear) pDateClear.onclick = () => { state.promiseDate = null; render(); };
  const pOwner = document.getElementById('pOwner');
  if (pOwner) pOwner.onchange = e => { state.promiseOwner = e.target.value || null; render(); };
  wireFollowUps();
  $view.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Marking…';
    try {
      await post(`/promises/${encodeURIComponent(b.dataset.done)}/done`, {});
      setTimeout(render, 1200); // the promise's workflow records it, then it moves to the history
    } catch (e) { b.disabled = false; b.textContent = 'Mark done'; b.nextElementSibling.textContent = e.message; }
  });
}

// ------------------------------------------------------------ links
async function renderLinks() {
  const [links, ps] = await Promise.all([api('/links'), api('/promises')]);
  const opt = ps.map(p => `<option value="${esc(p.id)}">${esc(p.what)} (${esc(name(p.owner))})</option>`).join('');
  const row = l => `<div class="card"><div><b>${esc(l.toWhat)}</b> <span class="meta">(${esc(name(l.toOwner))})</span> depends on
      <b>${esc(l.fromWhat)}</b> <span class="meta">(${esc(name(l.fromOwner))})</span> ${pill(l.status)}</div>

// ------------------------------------------------------------ graph
async function renderGraph() {
  const [links, ps] = await Promise.all([api('/links'), api('/promises?all=true')]);
  const shown = links.filter(l => l.status !== 'rejected');
  const byId = Object.fromEntries(ps.map(p => [p.id, p]));
  const ids = [...new Set(shown.flatMap(l => [l.from, l.to]))].filter(id => byId[id]);
  if (!ids.length) { $view.innerHTML = '<h2>Graph</h2><div class="empty">No links to draw yet.</div>'; return; }
  // Layer each promise by its longest chain of upstream promises.
  const ups = id => shown.filter(l => l.to === id).map(l => l.from);
  const layer = {};
  const depth = (id, seen = new Set()) => {
    if (layer[id] !== undefined) return layer[id];
    if (seen.has(id)) return 0; // a loop: draw it, don't recurse forever
    seen.add(id);
    const u = ups(id).filter(x => ids.includes(x));
    return (layer[id] = u.length ? 1 + Math.max(...u.map(x => depth(x, seen))) : 0);
  };
  ids.forEach(id => depth(id));
  const cols = {};
  ids.forEach(id => (cols[layer[id]] ||= []).push(id));
  const W = 230, H = 56, GX = 70, GY = 22, P = 20;
  const pos = {};
  Object.entries(cols).forEach(([c, list]) => list.forEach((id, r) => pos[id] = { x: P + c * (W + GX), y: P + r * (H + GY) }));
  const width = P * 2 + (Math.max(...Object.keys(cols).map(Number)) + 1) * (W + GX) - GX;
  const height = P * 2 + Math.max(...Object.values(cols).map(l => l.length)) * (H + GY) - GY;
  const color = s => getComputedStyle(document.documentElement).getPropertyValue(
      { active: '--good', at_risk: '--warn', broken: '--bad' }[s] || '--muted').trim();
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  const edges = shown.filter(l => pos[l.from] && pos[l.to]).map(l => {
    const a = pos[l.from], b = pos[l.to];
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const back = x2 <= x1;
    const d = back ? `M${x1},${y1} C${x1 + 60},${y1 - 80} ${x2 - 60},${y2 - 80} ${x2},${y2}` : `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`;
    return `<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.3" ${l.status === 'suggested' ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#arr)"/>`;
  }).join('');
  const nodes = ids.map(id => { const p = byId[id], { x, y } = pos[id];
    return `<g><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" fill="var(--panel)" stroke="${color(p.status)}" stroke-width="1.6"/>
      <text x="${x + 10}" y="${y + 22}" font-weight="600">${esc(clip(p.what, 32))}</text>
      <text x="${x + 10}" y="${y + 41}" fill="var(--muted)" style="fill:var(--muted)">${esc(clip(name(p.owner), 16))} · ${esc(p.due || 'no date')} · ${esc(p.status.replace('_', ' '))}</text></g>`; }).join('');
  $view.innerHTML = `<h2>Graph</h2>
    <p class="lead">Arrows point from a promise to the promises waiting on it. Dashed arrows are suggestions not yet confirmed. Border colour shows status.</p>
    <div class="card" style="overflow:auto"><svg width="${width}" height="${height}" role="img" aria-label="Dependency graph of promises">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
      ${edges}${nodes}</svg></div>`;
}

/** The day cover is planned: a few days before the absence starts (never before today). */
function planDay(startsOn) {
  const d = new Date(startsOn + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - (state.me.handoffPrepDays ?? 3));
  const today = new Date().toISOString().slice(0, 10);
  const day = d.toISOString().slice(0, 10);
  return day < today ? today : day;
}

// ------------------------------------------------------------ follow-up drafts (on the Promises page)
// promise id -> { draft, writing, previous, error, edit }: kept across the 10 s refresh so a draft stays open.
const followUps = {};
const hasUnsavedDraft = () => Object.values(followUps).some(f => f.edit !== undefined && f.draft && f.edit !== f.draft.body);

const isTemplate = d => String(d.writtenBy || '').startsWith('template');
const writtenByLabel = d => isTemplate(d) ? 'Plain template, no AI'
  : String(d.writtenBy || '').startsWith('ollama:') ? `Drafted by ${esc(d.writtenBy.slice(7))} on this computer` : 'Drafted by Claude';
const templateReason = d => String(d.writtenBy || '').replace(/^template:?\s*/, '') || 'Claude is not set up for drafts';

function followUpPanel(id) {
  const f = followUps[id];
  if (f.error) return `<div class="err">${esc(f.error)}</div><div class="row"><button class="act" data-fu="close">Close</button></div>`;
  if (f.writing || !f.draft) return '<div class="meta">Reading the email thread and drafting a follow-up… (a model on this computer can take up to a minute)</div>';
  const d = f.draft;
  const text = f.edit ?? d.body;
  return `<div class="draft-head"><div><b>${esc(d.subject)}</b> <span class="meta">to ${esc(d.to || '—')}</span></div>
      <span class="meta">${writtenByLabel(d)} · ${when(d.updatedAt)}</span></div>
    ${isTemplate(d) ? `<div class="note">${f.writer && !f.writer.startsWith('template')
      ? 'This plain version was written before the AI writer was set up. Click Rewrite to have it written from the email thread.'
      : `No AI writer is drafting right now: ${esc(templateReason({ writtenBy: f.writer || d.writtenBy }))}. Until then, Rewrite gives the same plain template.`}</div>` : ''}
    <textarea aria-label="Follow-up draft">${esc(text)}</textarea>
    <div class="row">
      <button class="act primary" data-fu="copy">Copy</button>
      <a class="act" href="${esc(d.gmailUrl)}" target="_blank" rel="noopener">Open thread in Gmail</a>
      <button class="act" data-fu="save" ${f.edit !== undefined && f.edit !== d.body ? '' : 'hidden'}>Save changes</button>
      <button class="act" data-fu="close">Close</button>
      <span class="err" role="alert"></span></div>
    <div class="row"><input type="text" style="flex:1;min-width:200px" placeholder="Ask for changes, e.g. “longer” or “more formal”" aria-label="Instruction for the AI writer">
      <button class="act" data-fu="rewrite">Rewrite</button></div>`;
}

/** Asks for a follow-up; if it has to be written, checks back every 2 s until it appears (up to 4 min, for slow local models). */
async function startFollowUp(id, instruction = null, regenerate = false) {
  followUps[id] = { ...(followUps[id] || {}), writing: true, error: null };
  delete followUps[id].edit;
  render();
  try {
    const r = await post(`/drafts/promise/${encodeURIComponent(id)}`, { instruction, regenerate });
    if (r.status === 'ready') { followUps[id] = { draft: r.draft, writer: r.writer }; render(); return; }
    const previous = r.previous;
    for (let i = 0; i < 120; i++) {
      await new Promise(res => setTimeout(res, 2000));
      if (!followUps[id]) return; // closed meanwhile
      const g = await api(`/drafts/promise/${encodeURIComponent(id)}`);
      if (g.draft && g.draft.updatedAt !== previous) { followUps[id] = { draft: g.draft, writer: g.writer }; render(); return; }
    }
    followUps[id] = { error: 'No draft yet. The AI writer may be busy or stuck; try again (the app log says more).' };
  } catch (e) { followUps[id] = { error: e.message }; }
  render();
}

function wireFollowUps() {
  $view.querySelectorAll('[data-draft-for]').forEach(b => b.onclick = () => {
    const id = b.dataset.draftFor;
    if (followUps[id]) { delete followUps[id]; render(); } else startFollowUp(id);
  });
  $view.querySelectorAll('tr[data-fu-row]').forEach(row => {
    const id = row.dataset.fuRow;
    const t = row.querySelector('textarea');
    if (t) t.oninput = () => {
      followUps[id].edit = t.value;
      row.querySelector('[data-fu="save"]').hidden = t.value === followUps[id].draft.body;
    };
    row.querySelectorAll('[data-fu]').forEach(b => b.onclick = async () => {
      const err = row.querySelector('.err');
      try {
        if (b.dataset.fu === 'close') { delete followUps[id]; render(); }
        else if (b.dataset.fu === 'copy') {
          await navigator.clipboard.writeText(t.value);
          b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1500);
        } else if (b.dataset.fu === 'save') {
          b.disabled = true;
          followUps[id] = { draft: await put(`/drafts/${encodeURIComponent(followUps[id].draft.id)}`, { body: t.value }), writer: followUps[id].writer };
          render();
        } else if (b.dataset.fu === 'rewrite') {
          startFollowUp(id, row.querySelector('input[type=text]').value || null, true);
        }
      } catch (e) { if (err) err.textContent = e.message; b.disabled = false; }
    });
  });
}

function renderSignIn() {
  document.body.classList.add('auth');
  // A small constellation: promises as stars, the lines between them as who depends on whom.
  const stars = [[60,90,1.6],[140,60,1.2],[230,120,2.2],[310,70,1.4],[380,150,1.8],[120,190,1.4],[260,220,1.2],[340,250,2],[70,280,1.2],[200,300,1.6],[420,60,1],[30,170,1]];
  const edges = [[0,1],[1,2],[2,3],[3,4],[2,5],[5,6],[6,7],[4,7],[5,8],[6,9],[3,10]];
  const svg = `<svg class="constellation" viewBox="0 0 460 560" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    ${edges.map(([a, b]) => `<line x1="${stars[a][0]}" y1="${stars[a][1]}" x2="${stars[b][0]}" y2="${stars[b][1]}"/>`).join('')}
    ${stars.map(([x, y, r], i) => `<circle cx="${x}" cy="${y}" r="${r}" opacity="${0.55 + (i % 3) * 0.15}"/>`).join('')}</svg>`;
  $view.innerHTML = `<section class="auth-card">
    <div class="auth-art">
      ${svg}
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="8" r="2.2"/><circle cx="11" cy="18" r="2.2"/><path d="M7 7l10 1M6.3 8l3.6 8M17.8 10l-5.4 6.4"/></svg>Promise Graph</div>
      <div class="caption"><p id="authCaption" aria-live="polite">${esc(SIGNIN_CAPTIONS[0])}</p>
        <div class="dots">${SIGNIN_CAPTIONS.map((_, i) => `<button type="button" data-i="${i}" class="${i ? '' : 'on'}" aria-label="Show caption ${i + 1}"></button>`).join('')}</div></div>
    </div>
    <div class="auth-form">
      <h1>Sign in</h1>
      <p class="sub">Use your Google account to get started.</p>
      <a class="google" href="/login"><svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google</a>
      <p class="fine">Promise Graph reads your Gmail read-only to find the promises you make and the requests made to you. Only you see them.</p>
    </div></section>`;
  const cap = document.getElementById('authCaption');
  const dots = [...$view.querySelectorAll('.dots button')];
  let at = 0, timer;
  const show = i => {
    at = i; cap.classList.add('fade');
    setTimeout(() => { cap.textContent = SIGNIN_CAPTIONS[i]; cap.classList.remove('fade'); }, 250);
    dots.forEach((d, j) => d.classList.toggle('on', j === i));
  };
  const cycle = () => { clearInterval(timer); timer = setInterval(() => show((at + 1) % SIGNIN_CAPTIONS.length), 5000); };
  dots.forEach(d => d.onclick = () => { show(+d.dataset.i); cycle(); });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) cycle();
}
async function signedIn() {
  // Team mode: who you are comes from Google, not from a dropdown.
  const res = await fetch('/api/me');
  state.me = await res.json().catch(() => ({ mode: 'none' }));
  if (state.me.mode !== 'google') return true;
  document.querySelector('label.who').hidden = true;
  if (!state.me.signedIn) {
    document.getElementById('tabs').hidden = true;
    renderSignIn();
    return false;
  }
  state.person = state.me.email;
  const acct = document.getElementById('account');
  acct.hidden = false;
  acct.innerHTML = `${esc(state.me.name)} <button class="act" id="signOut">Sign out</button>`;
  document.getElementById('signOut').onclick = async () => { await fetch('/logout', { method: 'POST' }); location.reload(); };
  document.getElementById('teamTab').hidden = false;
  if (state.me.gmailProblem) {
    const b = document.getElementById('gmailProblem');
    b.hidden = false;
    b.innerHTML = `Promise Graph can't read your Gmail right now (${esc(state.me.gmailProblem)}).
      <a href="/login">Sign in again</a> and allow Gmail access; reading picks up where it stopped.`;
  }
  return true;
}

async function init() {
  if (!(await signedIn())) return;
  let peopleError = null;
  try { state.people = await api('/people'); } catch (e) { state.people = []; peopleError = e.message; }
  const sel = document.getElementById('person');
  if (peopleError) {
    // Without people nobody can be chosen, and every tab would only say who is viewing is missing.
    $view.innerHTML = `<div class="empty">Could not load the list of people: ${esc(peopleError)}.<br>
      The app is reachable but failed to answer; the error is in the app's log (look for "Caused by").</div>`;
    return;
  }
  sel.innerHTML = state.people.map(p => `<option value="${esc(p.id)}">${esc(p.name)}${p.lead ? ' (lead)' : ''}</option>`).join('');
  if (state.me.mode !== 'google') {
    state.person = store.get('pg.person') && state.people.some(p => p.id === store.get('pg.person')) ? store.get('pg.person') : state.people[0]?.id;
  }
  if (state.person) sel.value = state.person;
  // With Gmail connected the only viewer is that account, so say so instead of offering a choice.
  if (state.me.mode !== 'google' && state.people.length === 1) { document.querySelector('.who').firstChild.textContent = 'Gmail account '; sel.disabled = true; }
  sel.onchange = () => { state.person = sel.value; store.set('pg.person', sel.value); render(); };
  const saved = store.get('pg.tab');
  if (saved && views[saved] && !document.querySelector(`#tabs [data-tab="${saved}"]`).hidden) document.querySelector(`#tabs [data-tab="${saved}"]`).click(); else render();
  setInterval(() => {
    if ($view.querySelector('input:focus, select:focus, textarea:focus') || hasUnsavedDraft()) return; // keep what's being typed
    render();
  }, 10000);
}
init();
</script>
