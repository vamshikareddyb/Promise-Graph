# Local development stack: Temporal (with its own Postgres), Temporal UI, and the
# application database. Start everything with `make up`.
#
# Image tags are pinned for reproducibility. Check https://hub.docker.com/u/temporalio
# for newer versions before upgrading.

services:
  temporal-db:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - temporal-db
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: promise
      POSTGRES_PASSWORD: promise
      POSTGRES_DB: promise_graph
    ports:
      - "5433:5432"
    volumes:
      - app-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  # Optional: metrics and dashboards. Start with `docker compose --profile observability up -d`.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  temporal-db:
  app-db:
